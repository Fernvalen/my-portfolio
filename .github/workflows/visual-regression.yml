name: Visual Regression Quality Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  visual-regression:
    name: Playwright Visual Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Visual Regression Tests
        run: npm run test:visual

      - name: Upload Visual Diffs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-reports
          path: |
            test-results/
            playwright-report/
          retention-days: 7