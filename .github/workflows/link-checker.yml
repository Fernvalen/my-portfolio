name: Check Broken Links

on:
  workflow_dispatch:
  push:
    paths:
    - 'src/content/blog/**.md' # <-- Updated path
    - 'src/pages/**.astro'

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Check Static Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './dist/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}