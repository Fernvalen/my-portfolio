name: Check Broken Links

on:
  workflow_dispatch:
  push:
    paths:
    - 'src/content/blog/**.md' # <-- Updated path
    - 'src/pages/**.astro'

jobs:
  link-checker:
    name: Lychee Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install & Build Site
        run: |
          npm ci
          npm run build

      - name: Start Astro Preview Server
        run: |
          npx astro preview --background
          sleep 3

      - name: Check Site Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose 
            --no-progress 
            http://localhost:4321/my-portfolio/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}